              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Opportunities"
            name: "opportunities"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "List"
                name: "list"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Roles", name: "roles", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
      - name: "nri"
        label: "NRI Customers"
        file: "nri.md"
        fields:
