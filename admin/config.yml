
backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to main)
  repo: MarioWindsor/bgc-smart-cat

# when using the default proxy server port
local_backend: true

# publish_mode: editorial_workflow
media_folder: "/media/uploads" # Media files will be stored in the repo under static/images/uploads
public_folder: "/media/uploads" # The src attribute for uploaded media will begin with /images/uploads
collections:
  - name: "projects" # Used in routes, e.g., /admin/collections/faqs
    label: "Projects" # Used in the UI
    folder: "projects" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # The Path to the File/Data/URL
    sortable_fields: ['date', 'title']
    fields: # The fields for each document, usually in front matter
      - { label: "Tags", name: "tags", widget: "hidden", default: ["projects"] }
      - { label: "Created Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Heading", name: "heading", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

