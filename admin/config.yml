            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Reasons Section"
            name: "reasons"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "List"
                name: "list"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Steps Section"
            name: "steps"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
              - label: "List"
                name: "list"
