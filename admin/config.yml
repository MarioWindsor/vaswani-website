            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", choose_url: false }
              - label: "List"
                name: "list"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
      - name: "home"
        label: "Home"
        file: "index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/home.liquid" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Cover"
            name: "cover"
            required: false
            widget: "object"
            collapsed: false
            fields:
              - { label: Video ID, name: video, widget: string, required: false, hint: "YouTube Video ID (Eg: cQnebxxGXCs)" }
              - { label: Link, name: link, widget: string, required: false, hint: "Eg: https://youtu.be/cQnebxxGXCs" }
              - { label: "Open Link in New Tab", name: "link-external", widget: "boolean", default: false, required: false }
      - name: "my-home"
        label: "MyHome"
        file: "my-home/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/my-home.liquid" }
          - label: "Intro Section"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
