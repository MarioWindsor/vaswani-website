                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image", choose_url: false }
      - name: "channel-partner"
        label: "Channel Partner"
        file: "channel-partner.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/channel-partner.liquid" }
          - label: "Cover"
            name: "cover"
            widget: "object"
            fields:
              - { label: "Background Image", name: "background", widget: "image", choose_url: false, required: false }
