
backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to main)
  repo: MarioWindsor/bgc-smart-cat

# when using the default proxy server port
local_backend: true

# publish_mode: editorial_workflow
media_folder: "/media/uploads" # Media files will be stored in the repo under static/images/uploads
public_folder: "/media/uploads" # The src attribute for uploaded media will begin with /images/uploads
collections:
  - name: "projects" # Used in routes, e.g., /admin/collections/faqs
    label: "Projects" # Used in the UI
    folder: "projects" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{name}}" # The Path to the File/Data/URL
    editor:
      preview: false
    sortable_fields: ['date', 'name']
    fields: # The fields for each document, usually in front matter
      - { label: "Tags", name: "tags", widget: "hidden", default: ["projects"] }
      - { label: "Created Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Project Name", name: "name", widget: "string" }
      - label: "Overview"
        name: "overview"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Prefix Name with Vaswani", name: "prefix-name", widget: "boolean", default: true }
          - label: "Type"
            name: "type"
            widget: "select"
            multiple: false
            options:
              - { label: "Residential", value: "residential" }
              - { label: "Commercial", value: "commercial" }
            default: residential
          - { label: "Project Label", name: "project-label", widget: "string", required: false, hint: "Eg: Luxury 3 & 4 Bedroom Apartments" }
          - { label: "Starting Price", name: "starting-price", widget: "string", required: false, hint: "Eg: Starting at ₹2.82Cr" }
          - { label: "Unit Size", name: "unit-size", widget: "string", required: false, hint: "Eg: 1970sqft to 2730sqft Apartments" }
          - { label: "Location Label (Area, City)", name: "location-label", widget: "string", required: false, hint: "Eg: ECC Main Road, Whitefield" }
          - { label: "RERA Number", name: "rera-number", widget: "string", required: false, hint: "Eg: PRM/KA/RERA/1251/446/PR/180424/006808" }
          - label: "Status"
            name: "status"
            widget: "select"
            multiple: false
            options:
              - { label: "Ongoing", value: "ongoing" }
              - { label: "Completed", value: "completed" }
            default: ongoing
          - { label: "Status Label", name: "status-label", widget: "string", required: false, hint: "Eg: Construction in Full Swing" }
      - label: "Gallery"
        name: "gallery"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Logo", name: "logo", widget: "image", choose_url: true, required: false }
          - { label: "Video ID", name: "video", widget: "string", choose_url: true, required: false, hint: "YouTube Video ID (Eg: 3OyRc5eczbc)" }
          - label: "Images"
            name: "images"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.image}} {{fields.caption}}'
            fields: 
              - { label: "Image", name: "image", widget: "image", choose_url: true }
              - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Intro"
        name: "intro"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Site Plan"
        name: "siteplan"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
          - label: "Master Plan"
            name: "masterplan"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.image}} {{fields.caption}}'
            fields: 
              - { label: "Title", name: "title", widget: "string", }
              - { label: "Image", name: "image", widget: "image", choose_url: true }
          - label: "Floor Plan"
            name: "floorplan"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.title}} {{fields.image}}'
            fields: 
              - { label: "Title", name: "title", widget: "string", }
              - { label: "Image", name: "image", widget: "image", choose_url: true }
      - label: "Amenities"
        name: "amenities"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: Cover Image, name: cover-image, widget: image, choose_url: true, required: false, hint: "Dimensions: 1200 x 400 pixels" }
          - label: "Amenity"
            name: "amenity"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.name}} {{fields.icon}}'
            fields: 
              - {dlabel: "Name", name: "name", widget: "string", }
              - { label: "Icon", name: "icon", widget: "image", choose_url: true }
          - label: "Images"
            name: "images"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.image}} {{fields.caption}}'
            fields: 
              - { label: "Image", name: "image", widget: "image", choose_url: true }
              - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Brochure"
        name: "brochure"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Background Image", name: "background", widget: "background", required: false, choose_url: true, hint: "Dimensions: 1200 x 400 pixels" }
          - { label: "PDF File", name: "pdf", widget: "file", required: false, choose_url: true }
      - label: "Location"
        name: "location"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - { label: "Sub Heading", name: "sub-heading", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Map", name: "map", widget: "string", required: false, hint: 'Eg: <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3887.907211381899!2d77.73506491144487!3d12.9777862872854!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae11f093ce84ed%3A0x181d9c5cb50023cf!2sVaswani%20Starlight!5e0!3m2!1sen!2sin!4v1754159728105!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' }
          - label: "Places Nearby"
            name: "places"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.name}}'
            fields: 
              - { label: "Place Group Name", name: "name", widget: "string", required: false, hint: "Eg: Schools" }
              - label: "Place"
                name: "place"
                widget: "list"
                required: false
                minimize_collapsed: true
                summary: '{{fields.name}} {{fields.distance}}'
                fields: 
                  - { label: Place Name, name: name, widget: string, required: false, hint: "Eg: Mallya Aditi International School" }
                  - { label: Distance, name: distance, widget: string, required: false, hint: "Eg: 4.0 Km" }
      - label: "Progress"
        name: "progress"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Heading", name: "heading", widget: "string", required: false }
          - label: "Entry"
            name: "entry"
            widget: "list"
            required: false
            minimize_collapsed: true
            summary: '{{fields.title}}'
            fields: 
              - { label: Title, name: title, widget: string, required: false, hint: "Eg: Feb 2025" }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                required: false
                minimize_collapsed: true
                summary: '{{fields.image}} {{fields.caption}}'
                fields: 
                  - { label: "Image", name: "image", widget: "image", choose_url: true }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Banner"
        name: "banner"
        widget: "object"
        collapsed: true
        fields:
          - label: "Feature 1"
            name: "feature-1"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Position", name: "position", widget: "string", required: false, hint: "top left" }
              - { label: "Background", name: "background", widget: "image", choose_url: true, required: false }
          - label: "Feature 2"
            name: "feature-2"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Position", name: "position", widget: "string", required: false, hint: "top left" }
              - { label: "Background", name: "background", widget: "image", choose_url: true, required: false }
  - name: "blog" # Used in routes, e.g., /admin/collections/faqs
    label: "Blog" # Used in the UI
    folder: "blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # The Path to the File/Data/URL
    editor:
      preview: false
    sortable_fields: ['date', 'title']
    fields: # The fields for each document, usually in front matter
      - { label: "Tags", name: "tags", widget: "hidden", default: ["blog"] }
      - { label: "Created Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "testimonials" # Used in routes, e.g., /admin/collections/faqs
    label: "Testimonials" # Used in the UI
    folder: "testimonials" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # The Path to the File/Data/URL
    editor:
      preview: false
    sortable_fields: ['date', 'title']
    fields: # The fields for each document, usually in front matter
      - { label: "Tags", name: "tags", widget: "hidden", default: ["testimonials"] }
      - { label: "Created Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Rating", name: "rating", widget: "number", min: 0, max: 5, value_type: "int" }
      - { label: "Content", name: "content", widget: "text" }
  - name: "awards" # Used in routes, e.g., /admin/collections/faqs
    label: "Awards" # Used in the UI
    folder: "awards" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # The Path to the File/Data/URL
    editor:
      preview: false
    sortable_fields: ['date', 'title']
    fields: # The fields for each document, usually in front matter
      - { label: "Tags", name: "tags", widget: "hidden", default: ["awards"] }
      - { label: "Created Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Award Title", name: "title", widget: "string" }
      - { label: "Awarded By", name: "awarder", widget: "string" }
      - { label: "Award", name: "award", widget: "image", choose_url: true, required: false }
  - name: "settings"
    label: "Settings"
    files:
      - name: "menu"
        label: "Menu"
        file: "_data/menu.json"
        fields:
          - label: "link"
            name: "link"
            widget: "list"
            summary: '{{fields.title}} → {{fields.path}}'
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Path", name: "path", widget: "string" }
      - name: "home"
        label: "Home Page"
        file: "_data/home.json"
        fields:
          - { label: "Intro Video YouTube ID", name: "introvideoid", widget: "string" }
          - { label: "Brand Video YouTube ID", name: "brandvideoid", widget: "string" }
          - { label: "Helpdesk Timing", name: "helpdesktiming", widget: "string" }

